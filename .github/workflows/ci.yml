name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: sh scripts/check-secrets.sh
      - name: Registry seeds (policy needs quote + source_url)
        run: pip install pyyaml==6.0.2 && python3 scripts/validate_seeds.py
      - name: Workflows are up to date with the builder
        run: python3 n8n/build_workflows.py && git diff --exit-code n8n/workflows
      - name: Unit tests + coverage gates
        run: |
          python3 scripts/gen-env.py
          touch docs/google_credentials.json
          make test
