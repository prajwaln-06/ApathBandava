code: LOTTERY
name: Lottery / KBC / lucky draw prize
description: Says you won a lottery, KBC, lucky draw or gift and must pay tax/processing charges to claim it.
indicators:
- lottery
- kbc
- lucky draw
- won
- winner
- prize
- congratulations
- claim
- tax
- processing charges
- gift
- jio
- 25 lakh
example: Congratulations! You have won Rs 25 lakh in KBC lucky draw. Pay Rs 15,000 tax to claim your prize.
advice: You can't win a draw you never entered. Never pay 'tax' or fees to claim a prize.
advice_hi: जिस लॉटरी में आपने भाग नहीं लिया, उसे आप जीत नहीं सकते। इनाम के लिए 'टैक्स' या फीस न दें।
