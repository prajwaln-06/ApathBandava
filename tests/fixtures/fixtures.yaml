# ScamSaathi evaluation set (SRS 7.1): 60 items, all synthetic.
# Malicious links use reserved `.example` domains only (never live phishing URLs); phone numbers
# are placeholders. `expect` is the verdict we want; for scoring, any scam-group item counts as
# detected when the verdict is SCAM or SUSPICIOUS, and a legit item is a false positive when it is not
# NO_RED_FLAGS (NFR-12). `demo` links an item to the SRS 7.2 demo scenarios.

# ---------------- Scams (text) — 15 --------------------------------------------------------
